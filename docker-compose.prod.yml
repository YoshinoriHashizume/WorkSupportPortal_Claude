# 本番相当のローカル／サーバ起動用（ソースの bind mount なし）
# 事前に .env.production.local を用意するか、下記 environment を埋めてください。
#
# 起動:
#   docker compose -f docker-compose.prod.yml --env-file .env.production.local up -d --build
#
# アプリ: http://localhost:3000  （nginx 経由なら http://localhost:8080）
#
# Docker Desktop ではプロジェクト名 coredataintegrationportal-prod でグループ表示されます。
name: coredataintegrationportal-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: coredataintegrationportal-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coredataintegrationportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: ${POSTGRES_DB:-coredataintegrationportal}
    volumes:
      - coredataintegrationportal_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-coredataintegrationportal} -d ${POSTGRES_DB:-coredataintegrationportal}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: coredataintegrationportal-app-prod
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-coredataintegrationportal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-coredataintegrationportal}}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET を設定してください}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      ORACLE_CLIENT_LIB_DIR: /opt/oracle/instantclient
      LD_LIBRARY_PATH: /opt/oracle/instantclient
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: coredataintegrationportal-nginx-prod
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  coredataintegrationportal_pgdata_prod:
