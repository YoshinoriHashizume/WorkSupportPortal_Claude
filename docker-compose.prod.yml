# 本番 Compose。各サービスは env_file: .env.production を直接読む（.env へのコピーは不要）。
# 起動は WSL Ubuntu 上で: docker compose -f docker-compose.prod.yml up -d --buildservices:
  django_app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: worksupportportal-django-app-prod
    env_file:
      - .env.production
    environment:
      ORACLE_CLIENT_LIB_DIR: /opt/oracle/instantclient_21_13
      ORACLE_THICK_MODE: "true"
    ports:
      - "${APP_PUBLISH_PORT:-80}:3000"
    depends_on:
      django_postgres:
        condition: service_healthy
    restart: unless-stopped

  django_postgres:
    image: postgres:16-alpine
    container_name: worksupportportal-django-postgres-prod
    env_file:
      - .env.production
    volumes:
      - django_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  django_postgres_prod_data:
