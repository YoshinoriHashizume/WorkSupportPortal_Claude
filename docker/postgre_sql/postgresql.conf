# ===========================================
# PostgreSQL サーバー設定
# ===========================================

# -------------------------------------------
# 接続設定
# -------------------------------------------
listen_addresses = '*'
max_connections = 200

# -------------------------------------------
# 文字コード/ロケールの設定
# -------------------------------------------
# ※ デフォルトのエンコーディングはinitdb時に設定される
#    (docker-entrypoint-initdb.dまたは環境変数で制御)

# -------------------------------------------
# タイムゾーンの設定
# -------------------------------------------
timezone = 'Asia/Tokyo'
log_timezone = 'Asia/Tokyo'

# -------------------------------------------
# パフォーマンス設定
# -------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 8MB

# WAL設定（MySQLのinnodb_flush_log_at_trx_commit=2に相当）
synchronous_commit = off
wal_level = replica

# チェックポイント設定
checkpoint_completion_target = 0.9
max_wal_size = 256MB
min_wal_size = 64MB

# -------------------------------------------
# ログ設定
# -------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0

# スロークエリログ（MySQLのslow_query_logに相当）
log_min_duration_statement = 2000
log_statement = 'none'
log_duration = off

# ログフォーマット
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '

# -------------------------------------------
# セキュリティ設定
# -------------------------------------------
password_encryption = scram-sha-256

# -------------------------------------------
# タイムアウト設定
# -------------------------------------------
idle_in_transaction_session_timeout = 600000
statement_timeout = 0

# -------------------------------------------
# クライアント設定
# -------------------------------------------
client_encoding = 'UTF8'
lc_messages = 'en_US.UTF-8'
