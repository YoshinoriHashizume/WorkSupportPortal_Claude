services:
  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worksupportportal-django-app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "django-insecure-local-docker-development-key"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,192.168.3.180,django_app"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:3100,http://192.168.3.180:3100"
      DATABASE_URL: "postgresql://worksupportportal:worksupportportal_local_dev@django_postgres:5432/worksupportportal"
      AUTH_URL: "http://localhost:3100"
      AUTH_DEV_MODE: "true"
      ORACLE_USE_MOCK: "${ORACLE_USE_MOCK:-false}"
      ORACLE_HOST: "${ORACLE_HOST:-192.168.3.204}"
      ORACLE_PORT: "${ORACLE_PORT:-1521}"
      ORACLE_SID: "${ORACLE_SID:-EXPJ}"
      ORACLE_USER: "${ORACLE_USER:-EXPJ}"
      ORACLE_PASSWORD: "${ORACLE_PASSWORD:-EXPJ}"
      ORACLE_THICK_MODE: "${ORACLE_THICK_MODE:-true}"
      ORACLE_CLIENT_LIB_DIR: "${ORACLE_CLIENT_LIB_DIR:-/opt/oracle/instantclient_21_13}"
      GONENKUKUMI_COMPANY_CD: "${GONENKUKUMI_COMPANY_CD:-}"
    ports:
      - "3100:3000"
    volumes:
      - .:/app
    depends_on:
      django_postgres:
        condition: service_healthy

  django_postgres:
    image: postgres:16-alpine
    container_name: worksupportportal-django-postgres
    environment:
      POSTGRES_DB: worksupportportal
      POSTGRES_USER: worksupportportal
      POSTGRES_PASSWORD: worksupportportal_local_dev
    ports:
      - "55432:5432"
    volumes:
      - django_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksupportportal -d worksupportportal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  django_postgres_data:
